
<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kalkulator Diskon - Deva Carma</title>

    <link rel="stylesheet" href="./dist/output.css">
</head>

<body class="bg-gray-50 text-gray-800">

    <!-- Navbar -->
    <nav class="bg-white border-b-2 border-black">

        <div class="container mx-auto px-6 py-6
                    flex items-center justify-between">

            <h1 class="text-3xl font-bold text-stone-950">
                Portofolio
            </h1>

            <div class="flex gap-8 text-lg">

                <a href="index.html"
                   class="text-gray-500 hover:text-stone-500">
                    Home
                </a>

                <a href="about.html"
                   class="hover:text-stone-500">
                    About
                </a>

                <a href="Project.html"
                   class="hover:text-stone-500">
                    Project
                </a>

            </div>

        </div>

    </nav>

    <!-- Konten Utama -->
    <main class="min-h-screen px-6 py-12">

        <div class="max-w-2xl mx-auto">

            <!-- Judul -->
            <div class="text-center mb-8">

                <h2 class="text-3xl md:text-4xl font-bold text-rose-700">
                    Kalkulator Diskon
                </h2>

                <p class="text-gray-600 mt-3">
                    Hitung harga setelah diskon dengan mudah.
                </p>

            </div>

            <!-- Kartu Kalkulator -->
            <div class="bg-white rounded-2xl shadow-md p-6 md:p-8">

                <!-- Input Harga -->
                <div class="mb-5">

                    <label for="harga"
                        class="block font-semibold mb-2">

                        Harga Barang (Rp)

                    </label>

                    <input type="number"
                        id="harga"
                        placeholder="Contoh: 200000"
                        min="0"
                        class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-rose-400">

                </div>

                <!-- Input Diskon -->
                <div class="mb-6">

                    <label for="diskon"
                        class="block font-semibold mb-2">

                        Persentase Diskon (%)

                    </label>

                    <input type="number"
                        id="diskon"
                        placeholder="Contoh: 15"
                        min="0"
                        max="100"
                        class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-rose-400">

                </div>

                <!-- Tombol Hitung -->
                <button type="button"
                    onclick="hitungDiskon()"
                    class="block w-full bg-rose-700 text-white font-semibold py-3 rounded-lg hover:bg-rose-800 transition cursor-pointer">

                    Hitung Diskon

                </button>

                <!-- Hasil Perhitungan -->
                <div id="hasil"
                    class="hidden mt-6 bg-rose-50 rounded-xl p-5">

                    <h3 class="text-xl font-bold text-rose-700 mb-3">
                        Hasil Perhitungan
                    </h3>

                    <p id="tampilDiskon" class="mb-2"></p>

                    <p id="tampilHargaAkhir"
                        class="font-bold text-lg"></p>

                </div>

            </div>

        </div>

    </main>

    <!-- JavaScript -->
<script>

    function hitungDiskon() {

        let harga = Number(document.getElementById("harga").value);
        let diskon = Number(document.getElementById("diskon").value);

        if (harga <= 0 || diskon < 0 || diskon > 100) {
            alert("Masukkan harga dan diskon yang valid!");
            return;
        }

        let jumlahDiskon = harga * diskon / 100;
        let hargaAkhir = harga - jumlahDiskon;

        document.getElementById("hasil").classList.remove("hidden");

        document.getElementById("tampilDiskon").textContent =
            "Potongan harga: Rp" + jumlahDiskon.toLocaleString("id-ID");

        document.getElementById("tampilHargaAkhir").textContent =
            "Harga akhir: Rp" + hargaAkhir.toLocaleString("id-ID");

    }

</script>

</body>

</html>
