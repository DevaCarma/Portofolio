<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kalkulator Luas Bangun Datar</title>
  <!-- TailwindCSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- jQuery CDN -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: light dark; }
    html { font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Arial, "Apple Color Emoji", "Segoe UI Emoji"; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-50 to-slate-100 text-slate-800">
  <header class="p-6">
    <div class="max-w-4xl mx-auto">
      <h1 class="text-3xl md:text-4xl font-bold tracking-tight">Kalkulator Luas Bangun Datar</h1>
     </div>
  </header>

  <main class="px-6 pb-16">
    <div class="max-w-4xl mx-auto grid md:grid-cols-3 gap-6">
      <!-- Kartu Pilihan Bangun Datar -->
      <section class="md:col-span-1 bg-white rounded-2xl shadow p-5 border border-slate-200">
        <h2 class="font-semibold text-lg">1) Pilih Bangun Datar</h2>
        <label for="shape" class="sr-only">Bangun Datar</label>
        <select id="shape" class="mt-3 w-full rounded-xl border-slate-300 focus:border-indigo-500 focus:ring-indigo-500">
          <option value="persegi">Persegi</option>
          <option value="persegi_panjang">Persegi Panjang</option>
          <option value="segitiga">Segitiga</option>
          <option value="lingkaran">Lingkaran</option>
          <option value="jajar_genjang">Jajar Genjang</option>
          <option value="trapesium">Trapesium</option>
          <option value="belah_ketupat">Belah Ketupat</option>
          <option value="layang_layang">Layang-Layang</option>
        </select>

        <div class="mt-6">
          <label for="satuan" class="block text-sm font-medium text-slate-700">Satuan Panjang</label>
          <select id="satuan" class="mt-2 w-full rounded-xl border-slate-300 focus:border-indigo-500 focus:ring-indigo-500">
            <option value="cm">cm</option>
            <option value="m">m</option>
            <option value="mm">mm</option>
          </select>
          <p class="mt-1 text-xs text-slate-500">Hasil luas akan otomatis menggunakan satuan persegi (misal cm², m²).</p>
        </div>
      </section>

      <!-- Kartu Input Parameter -->
      <section class="md:col-span-2 bg-white rounded-2xl shadow p-5 border border-slate-200">
        <h2 class="font-semibold text-lg">2) Isi Parameter</h2>
        <form id="paramForm" class="mt-4 grid sm:grid-cols-2 gap-4">
          <!-- Input dinamis akan dirender di sini -->
        </form>

        <div class="mt-6 flex flex-wrap gap-3">
          <button id="hitungBtn" class="px-4 py-2 rounded-xl bg-indigo-600 text-white font-semibold shadow hover:bg-indigo-700 active:scale-[.98]">Hitung Luas</button>
          <button id="resetBtn" type="button" class="px-4 py-2 rounded-xl bg-slate-100 text-slate-700 font-semibold border border-slate-200 hover:bg-slate-200">Reset</button>
        </div>

        <div id="notif" class="hidden mt-4 text-sm"></div>
      </section>

      <!-- Kartu Rumus & Hasil -->
      <section class="md:col-span-3 bg-white rounded-2xl shadow p-5 border border-slate-200">
        <h2 class="font-semibold text-lg">3) Rumus & Hasil</h2>
        <div class="mt-3 grid md:grid-cols-2 gap-4">
          <div class="rounded-xl border border-slate-200 p-4">
            <h3 class="font-semibold">Rumus</h3>
            <p id="rumusText" class="mt-2 text-slate-700">—</p>
            <ul id="catatan" class="mt-3 text-xs text-slate-500 list-disc list-inside"></ul>
          </div>
          <div class="rounded-xl border border-slate-200 p-4">
            <h3 class="font-semibold">Hasil</h3>
            <p id="hasilText" class="mt-2 text-2xl font-bold">—</p>
            <p id="detailText" class="mt-1 text-sm text-slate-600">Isi parameter lalu klik <em>Hitung Luas</em>.</p>
          </div>
        </div>
      </section>
    </div>
  </main>

  <footer class="px-6 pb-10">
    <div class="max-w-4xl mx-auto text-xs text-slate-500">Latihan Jquery</div>
  </footer>

  <script>
    // Konfigurasi bangun datar: label field, placeholder, dan fungsi perhitungan
    const SHAPES = {
      persegi: {
        name: 'Persegi',
        fields: [
          { key: 'sisi', label: 'Sisi', placeholder: 'contoh: 5' }
        ],
        formula: (p) => p.sisi ** 2,
        formulaText: 'L = s × s',
        notes: ['s = panjang sisi']
      },
      persegi_panjang: {
        name: 'Persegi Panjang',
        fields: [
          { key: 'panjang', label: 'Panjang', placeholder: 'contoh: 8' },
          { key: 'lebar', label: 'Lebar', placeholder: 'contoh: 5' }
        ],
        formula: (p) => p.panjang * p.lebar,
        formulaText: 'L = p × l',
        notes: ['p = panjang, l = lebar']
      },
      segitiga: {
        name: 'Segitiga',
        fields: [
          { key: 'alas', label: 'Alas', placeholder: 'contoh: 10' },
          { key: 'tinggi', label: 'Tinggi', placeholder: 'contoh: 6' }
        ],
        formula: (p) => 0.5 * p.alas * p.tinggi,
        formulaText: 'L = 1/2 × a × t',
        notes: ['a = alas, t = tinggi']
      },
      lingkaran: {
        name: 'Lingkaran',
        fields: [
          { key: 'jari', label: 'Jari-jari (r)', placeholder: 'contoh: 7' }
        ],
        formula: (p) => Math.PI * p.jari * p.jari,
        formulaText: 'L = π × r²',
        notes: ['Gunakan r = jari-jari']
      },
      jajar_genjang: {
        name: 'Jajar Genjang',
        fields: [
          { key: 'alas', label: 'Alas', placeholder: 'contoh: 12' },
          { key: 'tinggi', label: 'Tinggi', placeholder: 'contoh: 5' }
        ],
        formula: (p) => p.alas * p.tinggi,
        formulaText: 'L = a × t',
        notes: ['a = alas, t = tinggi (tegak lurus alas)']
      },
      trapesium: {
        name: 'Trapesium',
        fields: [
          { key: 'sisi_sejajar_1', label: 'Sisi Sejajar 1 (a)', placeholder: 'contoh: 10' },
          { key: 'sisi_sejajar_2', label: 'Sisi Sejajar 2 (b)', placeholder: 'contoh: 6' },
          { key: 'tinggi', label: 'Tinggi (t)', placeholder: 'contoh: 4' }
        ],
        formula: (p) => 0.5 * (p.sisi_sejajar_1 + p.sisi_sejajar_2) * p.tinggi,
        formulaText: 'L = 1/2 × (a + b) × t',
        notes: ['a & b = sisi-sisi sejajar, t = tinggi']
      },
      belah_ketupat: {
        name: 'Belah Ketupat',
        fields: [
          { key: 'diagonal1', label: 'Diagonal 1 (d1)', placeholder: 'contoh: 10' },
          { key: 'diagonal2', label: 'Diagonal 2 (d2)', placeholder: 'contoh: 8' }
        ],
        formula: (p) => 0.5 * p.diagonal1 * p.diagonal2,
        formulaText: 'L = 1/2 × d1 × d2',
        notes: ['d1 & d2 = diagonal']
      },
      layang_layang: {
        name: 'Layang-Layang',
        fields: [
          { key: 'diagonal1', label: 'Diagonal 1 (d1)', placeholder: 'contoh: 12' },
          { key: 'diagonal2', label: 'Diagonal 2 (d2)', placeholder: 'contoh: 7' }
        ],
        formula: (p) => 0.5 * p.diagonal1 * p.diagonal2,
        formulaText: 'L = 1/2 × d1 × d2',
        notes: ['d1 & d2 = diagonal']
      }
    };

    // Utilitas
    function numberOrNaN(value) {
      const n = parseFloat(String(value).replace(',', '.'));
      return isNaN(n) ? NaN : n;
    }

    function formatArea(value, unit) {
      if (!isFinite(value)) return '—';
      // Pembulatan adaptif
      const v = Math.round(value * 1000) / 1000;
      const sep = (v % 1 === 0) ? 0 : (v * 10 % 1 === 0 ? 1 : (v * 100 % 1 === 0 ? 2 : 3));
      return v.toLocaleString('id-ID', { minimumFractionDigits: sep, maximumFractionDigits: 3 }) + ` ${unit}²`;
    }

    function renderFields(shapeKey) {
      const cfg = SHAPES[shapeKey];
      const $form = $('#paramForm');
      $form.empty();
      cfg.fields.forEach(f => {
        const fieldId = `field_${f.key}`;
        const html = `
          <div class="space-y-2">
            <label for="${fieldId}" class="block text-sm font-medium text-slate-700">${f.label}</label>
            <input id="${fieldId}" name="${f.key}" type="number" step="any" inputmode="decimal" placeholder="${f.placeholder}" class="w-full rounded-xl border-slate-300 focus:border-indigo-500 focus:ring-indigo-500 p-2" />
          </div>`;
        $form.append(html);
      });

      // tampilkan rumus & catatan
      $('#rumusText').text(cfg.formulaText);
      const $notes = $('#catatan').empty();
      cfg.notes.forEach(n => $notes.append(`<li>${n}</li>`));

      // reset hasil
      $('#hasilText').text('—');
      $('#detailText').text('Isi parameter lalu klik Hitung Luas.');
      $('#notif').addClass('hidden').removeClass('text-red-700 bg-red-50 border-red-200').text('');
    }

    function collectParams(shapeKey) {
      const cfg = SHAPES[shapeKey];
      const params = {};
      let valid = true;
      let firstInvalidLabel = null;

      cfg.fields.forEach(f => {
        const val = numberOrNaN($(`[name=${f.key}]`).val());
        if (!isFinite(val) || val <= 0) {
          valid = false;
          firstInvalidLabel = firstInvalidLabel || f.label;
        }
        params[f.key] = val;
      });

      return { params, valid, firstInvalidLabel };
    }

    function showError(msg) {
      $('#notif').removeClass('hidden').addClass('mt-4 text-sm border rounded-lg p-3 bg-red-50 text-red-700 border-red-200').text(msg);
    }

    $(function () {
      // init
      renderFields($('#shape').val());

      // events
      $('#shape').on('change', function () { renderFields(this.value); });

      $('#resetBtn').on('click', function () {
        renderFields($('#shape').val());
        $('#paramForm').find('input').val('');
      });

      $('#hitungBtn').on('click', function (e) {
        e.preventDefault();
        const shapeKey = $('#shape').val();
        const satuan = $('#satuan').val();
        const cfg = SHAPES[shapeKey];
        const { params, valid, firstInvalidLabel } = collectParams(shapeKey);

        if (!valid) {
          showError(`Nilai pada \"${firstInvalidLabel}\" harus berupa angka positif.`);
          $('#hasilText').text('—');
          $('#detailText').text('Periksa kembali input Anda.');
          return;
        }

        try {
          const area = cfg.formula(params);
          const pretty = formatArea(area, satuan);
          $('#hasilText').text(pretty);
          const detail = Object.entries(params)
            .map(([k, v]) => `${k.replaceAll('_',' ')} = ${v}`)
            .join(', ');
          $('#detailText').text(`${cfg.name}: ${detail}`);
          $('#notif').addClass('hidden').text('');
        } catch (err) {
          showError('Terjadi kesalahan saat menghitung.');
          console.error(err);
        }
      });
    });
  </script>
</body>
</html>
